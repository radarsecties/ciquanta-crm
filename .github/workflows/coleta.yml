# CRM do CIQUANTA: coleta diária automática.
# Atualiza notícias, editais, canais institucionais, dados da Receita Federal, totais do Painel CIQUANTA,
# pessoas de P&D das organizações (OpenAlex e ORCID)
# e, com a chave da Anthropic configurada, descobre novas organizações nas notícias e busca na web
# os e-mails de diretorias, conferidos na página de origem antes de entrar na base.
# Este arquivo vale quando a pasta do CRM é a raiz do repositório.
name: CIQUANTA · Coleta diária

on:
  schedule:
    - cron: "17 9 * * *"    # 6h17 em Brasília
    - cron: "47 18 * * 1-5" # 15h47 em Brasília, dias úteis
  workflow_dispatch:
    inputs:
      etapas:
        description: 'Etapas a rodar, separadas por espaço (vazio: todas). Ex.: pesquisadores canais'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ciquanta-coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências da coleta
        working-directory: tools/coleta
        run: npm install --no-audit --no-fund
      - name: Coletar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CIQUANTA_MODELO: ${{ vars.CIQUANTA_MODELO }}
          CIQUANTA_LOTE_IA: ${{ vars.CIQUANTA_LOTE_IA }}
          CIQUANTA_LOTE_PESQUISA: ${{ vars.CIQUANTA_LOTE_PESQUISA }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ETAPAS: ${{ inputs.etapas }}
        run: node tools/coleta/coletar.mjs $ETAPAS
      - name: Publicar as bases atualizadas
        run: |
          git config user.name "CIQUANTA CRM"
          git config user.email "ciquanta-crm@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Coleta diária: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 10; done
          exit 1
      - name: Publish to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY}}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/institucionalciquanta
            git pull origin main
